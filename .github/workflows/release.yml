name: Release

# Tag pushes (v*) run the full gate and publish a GitHub Release; a manual
# workflow_dispatch run is a dry-run that stops after the build and attaches
# the artifacts to the workflow run without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...

  build:
    needs: test
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Build release binaries
        run: scripts/build-release.sh "${VERSION}" dist linux/amd64 linux/arm64
      - name: Package tarballs, unit, and checksums
        run: |
          cp deploy/yukariko.service dist/
          cd dist
          for BIN in yukariko-*; do
            [ -f "${BIN}" ] || continue
            tar -czf "${BIN}.tar.gz" "${BIN}"
            rm "${BIN}"
          done
          # Checksums over exactly the uploaded artifacts, so users who
          # download one tarball can verify with --ignore-missing.
          sha256sum ./*.tar.gz ./yukariko.service > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*
          --title "Yukariko ${GITHUB_REF_NAME}"
          --generate-notes
